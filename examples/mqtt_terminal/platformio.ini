; 正式 MQTT_TERMINAL 模式构建覆盖；示例只演示通用连接、订阅和消息回调。
[platformio]
default_envs = esp12f

[env:esp12f]
platform              = espressif8266
board                 = esp12e
framework             = arduino
monitor_speed         = 115200
upload_speed          = 460800
lib_extra_dirs        = ../..
lib_ldf_mode          = deep+
board_build.ldscript  = ../../partitions/esp8266-4mb-2mfs.ld
lib_deps =
    LittleFS
    bertmelis/espMqttClient @ 1.7.3
    ESP32Async/ESPAsyncTCP @ 2.0.0
build_flags =
    -DESP8266BASE_LOG_LEVEL=1
    -DESP8266BASE_DEFAULT_HOSTNAME=\"mqtt-terminal-example\"
    -DESP8266BASE_USE_WEB=1
    -DESP8266BASE_PROFILE_MQTT_TERMINAL=1
    -DESP8266BASE_USE_OTA=1
    -DESP8266BASE_USE_NTP=1
    -DESP8266BASE_USE_MDNS=0
    -DESP8266BASE_USE_SLEEP=0
    -DESP8266BASE_USE_WATCHDOG=1
    -DESP8266BASE_WEB_MAX_APP_PAGES=0
    -DESP8266BASE_WEB_MAX_APP_APIS=0
    -DESP8266BASE_WEB_AUTH_USER=\"admin\"
    -DESP8266BASE_WEB_AUTH_PASS=\"admin\"
