; MQTT 智能终端最小 Web/OTA 构建覆盖。
[platformio]
default_envs = esp12f

[env:esp12f]
platform              = espressif8266
board                 = esp12e
framework             = arduino
monitor_speed         = 115200
upload_speed          = 460800
lib_extra_dirs        = ../..
board_build.ldscript  = ../../partitions/esp8266-4mb-2mfs.ld
lib_deps              = LittleFS
build_flags =
    -DESP8266BASE_LOG_LEVEL=1
    -DESP8266BASE_DEFAULT_HOSTNAME=\"esp8266base-minimal\"
    -DESP8266BASE_USE_WEB=1
    -DESP8266BASE_WEB_PROFILE_MINIMAL=1
    -DESP8266BASE_USE_OTA=1
    -DESP8266BASE_USE_NTP=1
    -DESP8266BASE_USE_MDNS=1
    -DESP8266BASE_USE_SLEEP=0
    -DESP8266BASE_USE_WATCHDOG=1
    -DESP8266BASE_WEB_MAX_APP_PAGES=1
    -DESP8266BASE_WEB_MAX_APP_APIS=3
    -DESP8266BASE_WEB_AUTH_USER=\"admin\"
    -DESP8266BASE_WEB_AUTH_PASS=\"admin\"
